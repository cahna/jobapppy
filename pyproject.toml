[project]
name = "jobapppy"
version = "0.1.1"
description = "Tools to generate formatted resume documents (markdown, tex, pdf, etc) from yaml data."
authors = [
    {name = "Conor Heine", email = "conor.heine+jobapppy@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<4.0"
keywords = ["resume", "template"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Environment :: Console",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Pre-processors",
  "Topic :: Text Processing",
  "Topic :: Utilities",
  "Topic :: Other/Nonlisted Topic",
]
dependencies = [
    "Jinja2 (>=3.0.1,<4.0.0)",
    "typer[all] (>=0.15.0,<0.16.0)",
    "pyyaml (>=6.0.1,<7.0.0)",
    "pydantic[email] (>=2.5.3,<3.0.0)",
]

[project.urls]
Repository = "https://github.com/cahna/jobapppy"
Documentation = "https://cahna.github.io/jobapppy/"
Homepage = "https://cahna.github.io/jobapppy/"
"Bug Tracker" = "https://github.com/cahna/jobapppy/issues"

[project.scripts]
jobapppy = 'jobapppy.cli:cli'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
include = ["jobapppy/templates/*"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-json-ctrf = "^0.3.5"
coverage = {version = "^7.8.0", extras = ["toml"]}
ruff = "^0.12.8"
pre-commit = "^4.0.0"
mypy = "^1.15.0"
deptry = "^0.23.0"
types-PyYAML = "^6.0.12"
commitizen = "^4.8.0"
pytest-shell-utilities = "^1.9.7"

[tool.ruff]
line-length = 120
exclude = ["build", ".git", ".mypy_cache", ".pytest_cache", "htmlcov", "dist", "venv", ".venv", ".tox"]

[tool.ruff.lint]
select = ["B", "C", "D", "E", "F", "I", "N", "W"]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in __init__
    "D203", # 1 blank line required before class
    "D212", # Multi-line docstring summary should start at the first line
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
check_untyped_defs = true
exclude = ["dist", "build", "venv", ".venv", ".tox", ".mypy_cache", ".pytest_cache"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["jobapppy"]
omit = ["tests/*"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
