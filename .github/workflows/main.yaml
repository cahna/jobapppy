name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint-actions:
    name: Lint Github Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:latest

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
      - name: Check code formatting
        run: poetry run ruff format --check
      - name: Lint Python code
        run: poetry run ruff check

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
      - name: Run mypy
        run: poetry run mypy .

  check-deps:
    name: Check Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry
      - run: poetry check --lock
      - run: poetry run deptry .
      - name: Show any outdated dependencies
        run: poetry show --outdated

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs:
      - lint-actions
      - lint-markdown
      - lint-python
      - mypy
      - check-deps
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-poetry

      - name: Run tests
        run: poetry run pytest --ctrf test-report.json --cov --cov-config=pyproject.toml --cov-report=xml tests

      - name: Publish Test Summary Results
        run: npx github-actions-ctrf summary test-report.json

      - name: Publish Test Summary Results
        run: |
          echo "### Coverage

          \`\`\`
          $(poetry run coverage report -m)
          \`\`\`
          " >> "$GITHUB_STEP_SUMMARY"
  